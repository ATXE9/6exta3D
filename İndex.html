<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">

<title>Minik Dünya 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(255,255,255,.88);--ink:#3a1a45;--good:#14a38c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(35,18,60,.85);--ink:#fbeaff}}
:root[data-theme="dark"]{--panel:rgba(35,18,60,.85);--ink:#fbeaff}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;position:relative;overflow:hidden;background:#ffd3b8;color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:absolute;inset:0}
#stage canvas{display:block}
#quest{position:absolute;left:10px;top:10px;max-width:calc(100% - 150px);padding:10px 12px;border-radius:14px;background:var(--panel)}
#qt{display:block;font-weight:600;font-size:1.02rem}
#qd{display:block;font-size:.9rem;margin-top:2px}
#bar{height:8px;border-radius:4px;background:rgba(0,0,0,.15);margin-top:8px;overflow:hidden}
#fill{display:block;height:100%;width:0;background:var(--good);transition:width .3s}
#again{margin-top:8px;padding:8px 14px;border:0;border-radius:999px;background:var(--good);color:#fff;font:600 .9rem "Fredoka",system-ui,sans-serif;cursor:pointer}
#map{position:absolute;right:10px;top:10px;width:110px;height:110px;border-radius:14px;border:3px solid var(--panel)}
#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:var(--panel);font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#pad{position:absolute;left:18px;bottom:22px;width:120px;height:120px;border-radius:50%;background:var(--panel);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--good);opacity:.9}
.big{border:0;border-radius:16px;background:var(--good);color:#fff;font:600 1.05rem "Fredoka",system-ui,sans-serif;padding:0 14px;height:40px;font-size:.9rem;box-shadow:0 4px 0 #0d7767;cursor:pointer;touch-action:manipulation}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #0d7767}
.big:focus-visible,.card:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#chbtn{position:absolute;right:14px;bottom:22px}
#car{position:absolute;right:14px;bottom:75px;background:#3b82c4;box-shadow:0 4px 0 #1f5a94}
#car:active{box-shadow:0 1px 0 #1f5a94}
#act{position:absolute;left:calc(50% - 75px);width:150px;bottom:34px;height:44px;font-size:1rem;background:#e8a317;box-shadow:0 4px 0 #a8730d}
#act:active{box-shadow:0 1px 0 #a8730d}
#gold{position:absolute;right:10px;top:128px;padding:4px 10px;border-radius:999px;background:var(--panel);font-weight:600;pointer-events:none}
#deco{max-height:70vh;overflow:auto;touch-action:pan-y}
#deco .lbl{font-weight:600;margin:8px 0 2px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;margin:3px;box-shadow:0 0 0 2px rgba(0,0,0,.2);cursor:pointer}
.chip{border:0;border-radius:999px;padding:8px 12px;margin:3px;background:rgba(255,255,255,.6);color:#3a1a45;font:600 .85rem "Fredoka",system-ui,sans-serif;cursor:pointer}
.chip.on{background:var(--good);color:#fff}
#hp{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:1.5rem;color:#ff4d6d;pointer-events:none;letter-spacing:.1em}
#pbtn{position:absolute;left:18px;bottom:156px;height:36px;font-size:.85rem}
#pbar{height:10px;border-radius:5px;background:rgba(0,0,0,.18);overflow:hidden;max-width:420px;margin:0 auto}
#pfill{display:block;height:100%;width:0;background:var(--good);transition:width .3s}
#plist{display:grid;gap:8px;max-width:420px;margin:10px auto 14px;max-height:42vh;overflow:auto;touch-action:pan-y}
.tier{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.55);color:#3a1a45;font-weight:600;text-align:left}
.tier.got{background:#c8f3e8}
.tier span:last-child{font-size:.85rem;white-space:nowrap}
#hit{position:absolute;right:14px;bottom:128px;width:84px;height:46px;font-size:1rem;background:#e0475b;box-shadow:0 4px 0 #a82a3c}
#hit:active{box-shadow:0 1px 0 #a82a3c}
#sheet,#pass,#deco{position:absolute;left:0;right:0;bottom:0;padding:16px 14px 22px;border-radius:24px 24px 0 0;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:center;transition:transform .35s}
#sheet.off,#pass.off,#deco.off{transform:translateY(110%);pointer-events:none}
#sheet h2,#pass h2,#deco h2{margin:0 0 12px;font-size:1.2rem}
#cards{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:480px;margin:0 auto 14px}
.card{border:3px solid transparent;border-radius:16px;background:rgba(255,255,255,.55);color:#3a1a45;padding:6px 1px;font:600 .72rem "Fredoka",system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
.card b{display:block;font-size:1.5rem;line-height:1.2}
.card:disabled{opacity:.45;cursor:default}
.card.on{border-color:var(--good);background:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="quest"><b id="qt"></b><span id="qd"></span><div id="bar"><i id="fill"></i></div><button id="again" type="button" hidden>Yeniden başla</button></div>
<canvas id="map" width="220" height="220" aria-label="Harita"></canvas>
<div id="toast" aria-live="polite"></div>
<div id="pad"><i id="knob"></i></div>
<button class="big" id="hit" type="button" hidden>Vur</button>
<div id="deco" class="off"></div>
<button class="big" id="pbtn" type="button" hidden>Pass 0</button>
<div id="pass" class="off"><h2 id="ph">Ücretsiz Pass</h2><div id="pbar"><i id="pfill"></i></div><div id="plist"></div><button class="big" id="pclose" type="button">Kapat</button></div>
<div id="gold">🪙 0</div>
<div id="hp" hidden></div>
<button class="big" id="act" type="button" hidden>Gir</button>
<button class="big" id="car" type="button" hidden>Araba</button>
<button class="big" id="chbtn" type="button" hidden>Karakter</button>
<div id="sheet"><h2>Karakterini seç</h2><div id="cards"></div><button class="big" id="go" type="button">Oyuna başla</button></div>

<script>
const T=THREE,$=s=>document.querySelector(s);

const stage=$("#stage"),renderer=new T.WebGLRenderer({antialias:true});

const SKY=0xffcfe6,scene=new T.Scene();scene.fog=new T.Fog(SKY,35,110);

[[61,29,53,118,0xe6cf90],[-21,-67,133,43,0xf1f8fc]].forEach(([x,z,w,h,c])=>{const p=M(new T.PlaneGeometry(w,h),c,x,.05,z);p.rotation.x=-1.571;p.castShadow=false;scene.add(p);});

const LK=[[-14,-8,4.2],[62,40,5],[-60,-60,6,0xcfeefa]],TW=[70,-70],obs=LK.filter(l=>l.length<4),trees=[],DOORS=[];
const zone=(x,z)=>x>35&&z>-30?'d':z<-45&&x<45?'s':'g';
function tree(g,zn,i){
  const A=(geo,c,x,y,z)=>{const m=M(geo,c,x,y,z);g.add(m);return m;};
  if(zn==='d'){
    A(new T.CylinderGeometry(.25,.3,2.2,8),0x4d9a4a,0,1.1,0);
    A(new T.CylinderGeometry(.14,.14,.7,6),0x4d9a4a,.45,1.2,0).rotation.z=1.571;
    A(new T.CylinderGeometry(.13,.13,.8,6),0x4d9a4a,.75,1.55,0);
  }else if(zn==='s'){
    A(new T.ConeGeometry(1.3,2.2,7),0x2f6f55,0,2.3,0);A(new T.ConeGeometry(.95,1.8,7),0xf4fbff,0,3.4,0);
  }else if(i%4===0){
    A(new T.SphereGeometry(1.3,14,10),[0xff8fc7,0xffd23f,0xb98cff,0x6be07a][(i>>2)%4],0,2.4,0);
  }else{
    A(new T.ConeGeometry(1.3,2.2,7),i%3?0x2fc25b:0x1fae7a,0,2.3,0);A(new T.ConeGeometry(.95,1.8,7),i%3?0x4ee06e:0x30c28a,0,3.4,0);
  }
}
for(const[hx,hz,c]of[[-44,26,0xe9b872],[-36,34,0xd98880],[-50,36,0x85c1e9],[-40,44,0xf7dc6f],[-52,24,0xa9dfbf]]){
  scene.add(M(new T.BoxGeometry(4,2.8,4),c,hx,1.4,hz));
  const r=M(new T.ConeGeometry(3.4,2,4),0xb04a3a,hx,3.8,hz);r.rotation.y=.785;scene.add(r);
  scene.add(M(new T.BoxGeometry(.9,1.6,.1),0x6b4423,hx,.8,hz+2.03));
  obs.push([hx,hz,2.9]);DOORS.push({x:hx,z:hz,r:2.9,k:'house',label:'Eve gir'});
}
const CT=[12,56],npcs=[];let gcd=0;
function person(sh,hat){
  const g=new T.Group(),sk=[0xf1c9a5,0xd9a073,0x9b6a46,0xffdbb4][Math.floor(rnd()*4)];
  g.add(M(new T.CylinderGeometry(.22,.26,.7,8),sh,0,1,0));
  g.add(M(new T.SphereGeometry(.27,12,9),sk,0,1.62,0));
  if(hat){g.add(M(new T.CylinderGeometry(.4,.4,.05,12),hat,0,1.86,0));g.add(M(new T.CylinderGeometry(.24,.26,.15,12),hat,0,1.94,0));}
  g.legs=[-.1,.1].map(x=>{const l=new T.Group();l.position.set(x,.65,0);l.add(M(new T.CylinderGeometry(.09,.09,.6,6),0x3b4a6b,0,-.3,0));g.add(l);return l;});
  outline(g);g.rotation.order='YXZ';scene.add(g);return g;
}
function npc(g,ax,az,bx,bz,msg){g.position.set(ax,0,az);npcs.push({g,ax,az,bx,bz,to:1,w:rnd()*2,sp:1.4+rnd()*.6,msg});}
{
  const wc=document.createElement('canvas');wc.width=wc.height=64;
  const w2=wc.getContext('2d');w2.fillStyle='#fff';w2.fillRect(0,0,64,64);w2.fillStyle='#6f8fb0';
  for(let i=0;i<2;i++)for(let j=0;j<2;j++)w2.fillRect(8+i*28,8+j*28,18,16);
  const winTex=new T.CanvasTexture(wc);winTex.wrapS=winTex.wrapT=T.RepeatWrapping;winTex.encoding=T.sRGBEncoding;
  const pl=(dx,dz,w,h,c,y)=>{const p=M(new T.PlaneGeometry(w,h),c,CT[0]+dx,y,CT[1]+dz);p.rotation.x=-1.571;p.castShadow=false;scene.add(p);};
  pl(0,0,52,64,0xb8bec6,.06);
  pl(0,0,6,60,0x4a4f57,.1);pl(0,0,48,6,0x4a4f57,.1);pl(0,15,48,4,0x4a4f57,.1);pl(0,-15,48,4,0x4a4f57,.1);
  const pc=M(new T.CircleGeometry(6,24),0xd9dde2,CT[0],.14,CT[1]);pc.rotation.x=-1.571;pc.castShadow=false;scene.add(pc);
  scene.add(M(new T.CylinderGeometry(1.6,1.8,.6,16),0xcfd8dc,CT[0],.3,CT[1]));
  const wt=M(new T.CylinderGeometry(1.4,1.4,.1,16),0x4fb3e8,CT[0],.62,CT[1]);wt.castShadow=false;scene.add(wt);
  scene.add(M(new T.CylinderGeometry(.25,.35,1.8,8),0xcfd8dc,CT[0],1.2,CT[1]));
  obs.push([CT[0],CT[1],2]);
  const pal=[0xc9d6e8,0xe8cfc9,0xd9e8c9,0xe8e0c0,0xcfc9e8];let bi=0;
  for(const sx of[-17,-9,9,17])for(const sz of[-21,-9,9,21]){
    const h=8+rnd()*16,x=CT[0]+sx,z=CT[1]+sz,b=M(new T.BoxGeometry(6,h,6),pal[bi++%5],x,h/2,z),t=winTex.clone();
    t.needsUpdate=true;t.repeat.set(2,Math.max(2,Math.round(h/3.5)));b.material.map=t;scene.add(b);obs.push([x,z,4.4]);scene.add(M(new T.BoxGeometry(1.4,2.2,.15),0x5b3a29,x,1.1,z+3.05));DOORS.push({x,z,r:4.4,k:'house',label:'Binaya gir'});
  }
  const vc=[0xc0392b,0x2e86c1,0x28b463,0xd68910,0x8e44ad];
  [[-44,26],[-36,34],[-50,36],[-40,44],[-52,24]].forEach(([hx,hz],i)=>{
    const d=(i%2?-1:1)*(3+rnd()*3);
    npc(person(vc[i],0xe5c36b),hx,hz+4,hx+d,hz+4,'Köye hoş geldin!');
  });
  const cc=[0x34495e,0xe74c3c,0x16a085,0xf39c12,0x8e44ad,0x2980b9,0x7f8c8d];

LK.forEach(([lx,lz,lr,lc=0x35d6ff])=>{const p=M(new T.CircleGeometry(lr,28),lc,lx,.08,lz);p.rotation.x=-1.571;p.castShadow=false;p.material.transparent=true;p.material.opacity=.9;scene.add(p);});
function scatter(geo,n,cols,y,fl){
  const im=new T.InstancedMesh(geo,new T.MeshLambertMaterial({flatShading:true}),n),d=new T.Object3D();
  for(let i=0;i<n;i++){
    let x,z;do{x=(rnd()-.5)*176;z=(rnd()-.5)*176;}while(LK.some(l=>Math.hypot(x-l[0],z-l[1])<l[2]+.4)||(Math.abs(x-CT[0])<27&&Math.abs(z-CT[1])<32)||x<-66);

scatter(new T.ConeGeometry(.14,.7,4),1600,[0x5fb04f,0x6cc25a,0x4f9e45],.3);
scatter(new T.SphereGeometry(.13,6,5),320,[0xffffff,0xffd23f,0xff7aa8,0xb98cff],.14,1);
function free(min){
  for(let k=0;k<60;k++){
    const x=(rnd()-.5)*168,z=(rnd()-.5)*168;
    if(Math.hypot(x,z-6)>min&&Math.hypot(x-CT[0],z-CT[1])>40&&Math.hypot(x-66,z)>16&&Math.hypot(x+60,z+60)>7&&x>-64&&Math.hypot(x-TW[0],z-TW[1])>7&&obs.every(o=>Math.hypot(x-o[0],z-o[1])>o[2]+1.6))return[x,z];

for(let i=0;i<110;i++){
  const[x,z]=free(5),zn=zone(x,z),s=.8+rnd()*.7,g=new T.Group();

for(let i=0;i<30;i++){

  scene.add(M(new T.DodecahedronGeometry(1),zone(x,z)==='d'?0xc98f5a:0x9aa3ad,x,s*.6,z,[s,s*.7,s]));obs.push([x,z,s*.9]);
}
scene.add(M(new T.CylinderGeometry(1.8,2.2,9,10),0xe8d9f5,TW[0],4.5,TW[1]));
scene.add(M(new T.ConeGeometry(2.7,3.2,10),0xb04a6a,TW[0],10.6,TW[1]));

scene.add(M(new T.BoxGeometry(1.2,2,.3),0x2c3e50,TW[0],1,TW[1]+2.15));
const tring=M(new T.TorusGeometry(2.8,.12,8,28),0x38e8ff,TW[0],8.5,TW[1]);tring.rotation.x=1.571;tring.castShadow=false;scene.add(tring);
const sf=M(new T.CircleGeometry(9,28),0xcfe3ef,TW[0],.07,TW[1]);sf.rotation.x=-1.571;sf.castShadow=false;scene.add(sf);

/* toplanabilirler */
function item(kind,x,z){
  const g=new T.Group();
  if(kind==="star"){
    const s=M(new T.OctahedronGeometry(.5),0xffd23f,0,1.1,0);s.material.emissive=new T.Color(0x8a6a00);g.add(s);
  }else{
    g.add(M(new T.CylinderGeometry(.14,.18,.45,8),0xfff2e0,0,.22,0));

    if(d<r&&d>0){px=o[0]+dx/d*r;pz=o[1]+dz/d*r;if(driving)spd*=.7;}
  }
  const bx=inRoom?(inRoom==='lab'?RL[0]:inRoom==='pyr'?RP[0]:inRoom==='home'?RM[0]:inRoom==='arena'?RA[0]:inRoom==='race'?RR[0]:RH[0]):0,bz=inRoom?(inRoom==='lab'?RL[1]:inRoom==='pyr'?RP[1]:inRoom==='home'?RM[1]:inRoom==='arena'?RA[1]:inRoom==='race'?RR[1]:RH[1]):0,hl=inRoom==='race'?84:inRoom==='arena'?9:inRoom?5:86;px=Math.max(bx-hl,Math.min(bx+hl,px));pz=Math.max(bz-hl,Math.min(bz+hl,pz));if(!inRoom){if(onShip)px=Math.min(px,-67);else if(carY<4)px=Math.max(px,-66);}
  atk=Math.max(0,atk-dt);cd=Math.max(0,cd-dt);
  const a=atk>0?Math.sin(Math.PI*(1-atk/.35)):0;
  wk+=((mv?1:0)-wk)*Math.min(1,dt*10);ph+=mv?dt*11:0;
  hero.position.set(px+Math.sin(face)*a*.7,Math.abs(Math.sin(ph))*.12*wk,pz+Math.cos(face)*a*.7);
  if(hero.userData.L)hero.userData.L.forEach(l=>{const o=l.s>0?0:Math.PI,q=Math.sin(ph+o)*(l.arm?-1:1);l.m.position.z=l.bz+q*(l.arm?.16:.2)*wk;l.m.position.y=l.by+(l.arm?0:Math.max(0,Math.cos(ph+o))*.1*wk);});
  hero.rotation.y=face;hero.rotation.z=Math.sin(ph)*.09*wk;hero.rotation.x=a*.6+.1*wk;hero.scale.y=1+Math.sin(t*.003)*.015*(1-wk);hero.scale.x=isHata()&&Math.random()<.05?1.25:1;
  carY+=((flying&&driving?50:0)-carY)*Math.min(1,dt*1.5);hero.visible=!driving;if(onShip){shipM.position.set(px,.1+Math.sin(t*.003)*.08,pz);shipM.rotation.y=face;}
  if(driving){car.position.set(px,carY,pz);car.rotation.y=face;wheels.forEach(w=>w.rotation.x+=spd*dt*2.4);}
  const q=Q[qi];
  if(q){
    if(q.k==="tower"){if(Math.hypot(px-TW[0],pz-TW[1])<4)done();}
    else if(items[q.k])items[q.k].forEach(o=>{
      if(!o.got&&Math.hypot(px-o.x,pz-o.z)<1.4){o.got=true;o.m.visible=false;qp++;uiQ();addXp(q.k==="star"?20:25);if(qp>=q.n)done();}
    });
  }
  items.star.forEach((o,i)=>{const s=o.m.children[0];s.rotation.y=t*.002;s.position.y=1.1+Math.sin(t*.003+i)*.15;});
  npcs.forEach(n=>{
    const g=n.g;
    const dd=Math.hypot(px-g.position.x,pz-g.position.z);
    if(!n.dn&&dd<2.5&&!n.met&&n.msg[0]==='K'){n.met=true;const q=Q[qi];if(q&&q.k==='meet'){qp++;uiQ();if(qp>=q.n)done();}}
    if(!n.dn&&gcd<=0&&dd<2.5){toast(n.msg);gcd=5;}
    if(n.dn){
      n.dt+=dt;n.vy-=G*dt;g.position.x+=n.vx*dt;g.position.z+=n.vz*dt;g.position.y+=n.vy*dt;
      g.rotation.x+=(-1.571-g.rotation.x)*Math.min(1,dt*8);
      if(g.position.y<.3){g.position.y=.3;n.vy=n.vy<-2?-n.vy*.3:0;const f=Math.exp(-dt*4);n.vx*=f;n.vz*=f;}
      if(n.dt>3.5){n.dn=0;g.rotation.x=0;g.position.y=0;n.w=1;g.legs.forEach(l=>l.rotation.x=0);}
      return;
    }
    if(n.w>0){n.w-=dt;return;}
    const tx=n.to?n.bx:n.ax,tz=n.to?n.bz:n.az,dx=tx-g.position.x,dz=tz-g.position.z,d=Math.hypot(dx,dz);
    if(d<.3){n.to=1-n.to;n.w=1+rnd()*2;g.legs.forEach(l=>l.rotation.x=0);return;}
    g.position.x+=dx/d*n.sp*dt;g.position.z+=dz/d*n.sp*dt;g.rotation.y=Math.atan2(dx,dz);
    g.legs[0].rotation.x=Math.sin(t*.01*n.sp)*.7;g.legs[1].rotation.x=-g.legs[0].rotation.x;
    
  });
  gcd-=dt;
  foeStep(dt);pirStep(dt);btnLabel();raceStep(dt);carLook(t);
  cloudG.visible=!inRoom;spark.rotation.y+=dt*.03;spark.visible=!inRoom;cloudG.position.set(px*.85,0,pz*.85);
  cloudG.children.forEach(c=>{c.position.x+=dt*c.userData.s;if(c.position.x>130)c.position.x=-130;});
  dT-=dt;
  if(!inRoom&&(mv||(driving&&Math.abs(spd)>4))&&dT<=0){dT=driving?.05:.14;puff(px-Math.sin(face)*.4,pz-Math.cos(face)*.4);}
  dust.forEach(d=>{if(d.l>0){d.l-=dt;d.m.scale.setScalar(1+(.5-d.l)*3);d.m.material.opacity=Math.max(0,d.l/.5)*.6;if(d.l<=0)d.m.visible=false;}});
  if(!inRoom){
    if(driving&&Math.abs(spd)>3)npcs.forEach(n=>{if(!n.dn&&Math.hypot(n.g.position.x-px,n.g.position.z-pz)<2)knockNpc(n,Math.sin(face)*Math.sign(spd),Math.cos(face)*Math.sign(spd),Math.abs(spd)*.7);});
    balls.forEach(b=>{
      const m=b.m,p=m.position,r=.6;
      b.vy-=G*dt;p.x+=b.vx*dt;p.y+=b.vy*dt;p.z+=b.vz*dt;
      if(p.y<r){p.y=r;b.vy=b.vy<-2?-b.vy*.5:0;const f=Math.exp(-dt*1.3);b.vx*=f;b.vz*=f;}
      const dx=p.x-px,dz=p.z-pz,d=Math.hypot(dx,dz),rr=r+(driving?1.5:.7);
      if(d<rr&&d>0){const s=driving?Math.abs(spd)*1.3+4:6;if(Math.hypot(b.vx,b.vz)<s){b.vx=dx/d*s;b.vz=dz/d*s;if(driving&&Math.abs(spd)>8)b.vy=4;}}
      for(const o of obs){const ox=p.x-o[0],oz=p.z-o[1],od=Math.hypot(ox,oz),orr=o[2]+r;if(od<orr&&od>0){p.x=o[0]+ox/od*orr;p.z=o[1]+oz/od*orr;const dot=(b.vx*ox+b.vz*oz)/od;if(dot<0){b.vx-=1.6*dot*ox/od;b.vz-=1.6*dot*oz/od;}}}
      if(Math.abs(p.x)>86){p.x=Math.sign(p.x)*86;b.vx*=-.6;}
      if(Math.abs(p.z)>86){p.z=Math.sign(p.z)*86;b.vz*=-.6;}
      m.rotation.z-=b.vx*dt/r;m.rotation.x+=b.vz*dt/r;
    });
  }
  {
    let best=null,bd=9;
    if(!paused&&flying){if(!gotCloud&&Math.hypot(px-CL[0],pz-CL[2])<12&&Math.abs(carY-CL[1])<10)best=CLI;}else if(!paused&&!driving){
      if(inRoom){for(const it of inRoom==='lab'?LABI:inRoom==='pyr'?PYRI:inRoom==='home'?HOMEI:inRoom==='arena'?ARI:inRoom==='race'?[]:HOUSEI){const d=Math.hypot(px-it.x,pz-it.z)-it.r;if(d<0&&d<bd){best=it;bd=d;}}}
      else for(const dr of DOORS){const d=Math.hypot(px-dr.x,pz-dr.z)-dr.r-2.4;if(d<0&&d<bd){best=dr;bd=d;}}
    }
    nearIt=best;const ab=$('#act');ab.hidden=!best;if(best&&ab.textContent!==best.label)ab.textContent=best.label;
  }
  if(fxT>0){fxT-=dt;fx.visible=fxT>0;fx.scale.setScalar(1+(.3-fxT)*5);fx.material.opacity=Math.max(0,fxT/.3);}
  trees.forEach(tr=>{if(tr.sh>0){tr.sh-=dt;tr.g.rotation.z=Math.sin(t*.05)*tr.sh*.3;}else tr.g.rotation.z=Math.sin(t*.0015+tr.x)*.03;});
  if(!paused){let dy=face-cyaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));cyaw+=dy*(1-Math.exp(-dt*5));}
  const cd2=inRoom&&inRoom!=='race'?6:driving?13+Math.abs(spd)*.15:9.5;cam.position.lerp(CT3.set(px-Math.sin(cyaw)*cd2,inRoom&&inRoom!=='race'?8.5:driving?7.5+carY:6.5,pz-Math.cos(cyaw)*cd2),1-Math.exp(-dt*8));
  cam.fov+=((driving?55+Math.abs(spd)*.5:55)-cam.fov)*.1;cam.updateProjectionMatrix();
  cam.lookAt(px+Math.sin(cyaw)*3,1.2+carY,pz+Math.cos(cyaw)*3);
  sun.position.set(px-12,22,pz+9);sun.target.position.set(px,0,pz);
  renderer.render(scene,cam);
  if((fr=(fr+1)%3)===0)drawMap();
}

requestAnimationFrame(frame);
